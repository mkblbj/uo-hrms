<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NFC打刻は終了しました - UO HR</title>
    <link rel="icon" type="image/png" href="/assets/hrms/manifest/favicon-196.png?v=20260927">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #111827;
            --muted: #4b5563;
            --line: #e5e7eb;
            --accent: #2563eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1220;
                --card: #111a2e;
                --text: #f8fafc;
                --muted: #cbd5e1;
                --line: #1f2a44;
                --accent: #8bb4ff;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(env(safe-area-inset-top), 24px) 20px max(env(safe-area-inset-bottom), 24px);
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang SC", "Segoe UI", Roboto, sans-serif;
        }

        main {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--card);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 22px;
            line-height: 1.4;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .zh {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .zh h2 {
            margin: 0 0 8px;
            font-size: 17px;
        }

        a {
            display: inline-block;
            margin-top: 24px;
            color: var(--accent);
            font-size: 14px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>NFC打刻は終了しました</h1>
        <p>ホーム画面の ERP アプリを開いて、打刻ボタンから打刻してください。</p>
        <div class="zh" lang="zh-CN">
            <h2>NFC 打卡已停用</h2>
            <p>请打开手机主屏上的 ERP 应用，用打卡按钮打卡。</p>
        </div>
        <a href="/hrms">ブラウザで開く / 在浏览器中打开</a>
    </main>
</body>
</html>
